<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6659b">
  <meta name="description" content="ต้นแบบบัตรสะสมแต้ม TULIB LifeONLine สำหรับโครงงาน OM316">
  <title>บัตรสะสมแต้ม | TULIB LifeONLine</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="linebar">
      <div class="line-name"><span class="verified" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c3.7 0 7 1.6 9 3v6c0 5.1-3.9 9.4-9 11-5.1-1.6-9-5.9-9-11V5c2-1.4 5.3-3 9-3Z"/><path d="m7.8 11.7 2.7 2.8 5.7-5.8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>TULIB LifeONLine</div>
      <span class="preview-badge">ต้นแบบ · OM316</span>
    </header>
    <div class="web-head">
      <div class="web-title"><strong>บัตรสะสมแต้ม</strong><span>หอสมุดป๋วย อึ๊งภากรณ์ · มธ. รังสิต</span></div>
      <button type="button" class="icon-button" data-action="help" aria-label="วิธีใช้บัตรสะสมแต้ม" title="วิธีใช้งาน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9.3a2.3 2.3 0 1 1 3.9 1.6c-1 .9-1.7 1.1-1.7 2.7m0 2.8h.01" stroke-linecap="round"/></svg></button>
    </div>
    <div class="banner">
      <div class="banner-copy">
        <span class="eyebrow">LIFEONLINE POINT COLLECTION</span>
        <h1>สะสมแต้ม<br>แลกรางวัล</h1>
        <button type="button" class="balance-button" data-tab-go="rewards" aria-label="ดูคะแนนที่ใช้ได้และรางวัล"><span aria-hidden="true" class="mini-coin">✦</span><strong id="hero-points">24</strong><span>แต้มที่ใช้ได้</span><span class="balance-arrow" aria-hidden="true">›</span></button>
      </div>
      <svg class="coin-art" viewBox="0 0 400 235" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="43" y1="15" x2="165" y2="173" gradientUnits="userSpaceOnUse"><stop stop-color="#fff6a1"/><stop offset=".38" stop-color="#ffd566"/><stop offset="1" stop-color="#f39c29"/></linearGradient>
          <linearGradient id="edge" x1="22" y1="18" x2="140" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#ffc454"/><stop offset="1" stop-color="#c45a21"/></linearGradient>
          <linearGradient id="face" x1="29" y1="23" x2="139" y2="149" gradientUnits="userSpaceOnUse"><stop stop-color="#fff39b"/><stop offset="1" stop-color="#ffb640"/></linearGradient>
          <linearGradient id="purple" x1="12" y1="9" x2="141" y2="169" gradientUnits="userSpaceOnUse"><stop stop-color="#f2d9ff"/><stop offset=".45" stop-color="#ba81ef"/><stop offset="1" stop-color="#8543c4"/></linearGradient>
          <linearGradient id="purple-edge" x1="3" y1="17" x2="140" y2="173" gradientUnits="userSpaceOnUse"><stop stop-color="#e9b1ff"/><stop offset="1" stop-color="#592789"/></linearGradient>
          <radialGradient id="aura"><stop stop-color="#ffedb9" stop-opacity=".58"/><stop offset="1" stop-color="#ffcf94" stop-opacity="0"/></radialGradient>
          <linearGradient id="ribbon" x1="30" y1="0" x2="220" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#fff0d1"/><stop offset="1" stop-color="#ffe3a0"/></linearGradient>
          <g id="spark"><path d="M0-12C1.9-3.5 3.5-1.9 12 0 3.5 1.9 1.9 3.5 0 12-1.9 3.5-3.5 1.9-12 0-3.5-1.9-1.9-3.5 0-12Z" fill="currentColor"/></g>
          <g id="coin"><circle cx="86" cy="90" r="79" fill="url(#edge)"/><circle cx="77" cy="83" r="77" fill="url(#gold)" stroke="#fff0ab" stroke-width="2"/><circle cx="77" cy="83" r="61" fill="url(#face)" stroke="#e79836" stroke-width="2.5"/><circle cx="77" cy="83" r="55" stroke="#fff0a6" stroke-width="2"/><path d="M77 42c6 25 14 33 39 41-25 7-33 15-39 41-7-26-15-34-40-41 25-8 33-16 40-41Z" fill="#bc611d" opacity=".28" transform="translate(2 3)"/><path d="M77 42c6 25 14 33 39 41-25 7-33 15-39 41-7-26-15-34-40-41 25-8 33-16 40-41Z" fill="#ffeb8c" stroke="#e59832" stroke-width="2"/><path d="M21 65c6-20 18-32 32-38" stroke="#fff9c6" stroke-width="4" stroke-linecap="round"/></g>
        </defs>
        <ellipse cx="218" cy="117" rx="165" ry="111" fill="url(#aura)"/>
        <g stroke="#ffe3b9" opacity=".48"><ellipse cx="208" cy="122" rx="173" ry="62" transform="rotate(-15 208 122)"/><ellipse cx="208" cy="122" rx="161" ry="84" transform="rotate(22 208 122)" stroke-dasharray="2 7"/></g>
        <g transform="translate(198 30) rotate(17 70 78) scale(.88)"><circle cx="87" cy="92" r="75" fill="url(#purple-edge)"/><circle cx="76" cy="83" r="74" fill="url(#purple)" stroke="#f4d9ff" stroke-width="2"/><circle cx="76" cy="83" r="57" stroke="#e8c1fa" stroke-width="2"/><path d="M76 48c6 20 13 27 34 35-21 7-28 14-34 35-6-21-13-28-34-35 21-8 28-15 34-35Z" fill="#ead0ff" stroke="#9c55cb" stroke-width="2"/></g>
        <g transform="translate(98 32) rotate(-16 78 83)"><use href="#coin"/></g>
        <g transform="translate(269 133) rotate(20 39 40) scale(.47)"><use href="#coin"/></g>
        <g color="#fff4d3"><use href="#spark" x="75" y="66"/><use href="#spark" x="322" y="42"/><use href="#spark" x="339" y="155"/><use href="#spark" x="119" y="191"/><use href="#spark" transform="translate(269 21) scale(.55)"/><use href="#spark" transform="translate(47 145) scale(.68)"/><use href="#spark" transform="translate(359 100) scale(.55)"/></g>
        <g fill="#fff4d3" opacity=".72"><circle cx="101" cy="43" r="2.7"/><circle cx="338" cy="68" r="2.8"/><circle cx="88" cy="179" r="3"/><circle cx="354" cy="175" r="2"/><circle cx="227" cy="210" r="2.4"/></g>
      </svg>
    </div>
    <nav class="tabs" role="tablist" aria-label="หน้าของบัตรสะสมแต้ม">
      <button type="button" role="tab" aria-selected="true" aria-controls="panel" id="tab-challenge" data-tab="challenge"><span class="tab-icon"></span>Challenge</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="panel" id="tab-rewards" data-tab="rewards" tabindex="-1"><span class="tab-icon"></span>Reward &amp; Point</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="panel" id="tab-leaderboard" data-tab="leaderboard" tabindex="-1"><span class="tab-icon"></span>Leaderboard</button>
    </nav>
    <main id="panel" class="panel" role="tabpanel" aria-labelledby="tab-challenge" tabindex="0"></main>
    <footer><strong>TULIB LifeONLine</strong><span>ต้นแบบเพื่อการนำเสนอ · คะแนนและข้อมูลทั้งหมดเป็นข้อมูลจำลอง</span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" class="toast"></div>
</body>
</html>
